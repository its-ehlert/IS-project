<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Reports — AquaWatch Admin</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <a href="index.html" class="logo">
          <span class="logo-icon">💧</span>
          AquaWatch
        </a>
        <div class="logo-sub">Administration</div>
      </div>
      <nav class="admin-nav" aria-label="Admin navigation">
        <div class="admin-nav-section">Overview</div>
        <a href="index.html"><span class="nav-icon">📊</span> Dashboard</a>
        <div class="admin-nav-section">Management</div>
        <a href="reports.html"><span class="nav-icon">📋</span> Reports</a>
        <a href="users.html"><span class="nav-icon">👥</span> Users</a>
        <a href="monitoring.html"><span class="nav-icon">🖥️</span> System monitoring</a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../index.html">← Back to public site</a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="admin-mobile-toggle" aria-label="Toggle sidebar">☰</button>
          <h1>Report management</h1>
        </div>
      </header>

      <div class="admin-content">
        <div id="alert-container"></div>

        <div class="filter-bar">
          <select id="filter-status" class="form-control">
            <option value="">All reports</option>
            <option value="unverified">Pending verification</option>
            <option value="verified">Verified</option>
          </select>
          <select id="filter-neighborhood" class="form-control">
            <option value="">All neighbourhoods</option>
          </select>
          <input type="search" id="filter-search" class="form-control" placeholder="Search…">
        </div>

        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Reporter</th>
                  <th>Neighbourhood</th>
                  <th>Status</th>
                  <th>Details</th>
                  <th>Submitted</th>
                  <th>Verified</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="reports-table"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Admin.initReportsPage().catch((e) => alert(e.message));
    });
  </script>
</body>
</html>
