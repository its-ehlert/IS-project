<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — AquaWatch Nairobi</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <a href="index.html" class="logo">
         <!-- <span class="logo-icon">💧</span> -->
          AquaWatch
        </a>
        <div class="logo-sub">Administration</div>
      </div>
      <nav class="admin-nav" aria-label="Admin navigation">
        <div class="admin-nav-section">Overview</div>
        <a href="index.html"><span class="nav-icon">📊</span> Dashboard</a>
        <div class="admin-nav-section">Management</div>
        <a href="reports.html"><span class="nav-icon">📋</span> Reports</a>
        <a href="users.html"><span class="nav-icon">👥</span> Users</a>
        <a href="monitoring.html"><span class="nav-icon">🖥️</span> System monitoring</a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../index.html">← Back to public site</a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="admin-mobile-toggle" aria-label="Toggle sidebar">☰</button>
          <h1>Admin dashboard</h1>
        </div>
        <span class="badge badge-scheduled">Admin</span>
      </header>

      <div class="admin-content">
        <div class="stat-grid" id="admin-stats"></div>

        <div class="page-grid" style="margin-top: 1.5rem;">
          <div class="card">
            <div class="card-header">
              <h2>Reports pending verification</h2>
              <a href="reports.html" class="btn btn-secondary btn-sm">Manage all</a>
            </div>
            <div id="pending-reports"></div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2>System activity (7 days)</h2>
            </div>
            <div class="card-body">
              <div class="chart-container" style="height: 240px;">
                <canvas id="activity-chart"></canvas>
              </div>
            </div>
          </div>
        </div>

        <div class="card" style="margin-top: 1.5rem;">
          <div class="card-header">
            <h2>Recent user registrations</h2>
            <a href="users.html" class="btn btn-secondary btn-sm">Manage users</a>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Neighbourhood</th>
                  <th>Status</th>
                  <th>Joined</th>
                </tr>
              </thead>
              <tbody id="recent-users"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/mock-data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Admin.initDashboard();
    });
  </script>
</body>
</html>
