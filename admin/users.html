<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — AquaWatch Admin</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <a href="index.html" class="logo">
          <span class="logo-icon">💧</span>
          AquaWatch
        </a>
        <div class="logo-sub">Administration</div>
      </div>
      <nav class="admin-nav" aria-label="Admin navigation">
        <div class="admin-nav-section">Overview</div>
        <a href="index.html"><span class="nav-icon">📊</span> Dashboard</a>
        <div class="admin-nav-section">Management</div>
        <a href="reports.html"><span class="nav-icon">📋</span> Reports</a>
        <a href="users.html"><span class="nav-icon">👥</span> Users</a>
        <a href="monitoring.html"><span class="nav-icon">🖥️</span> System monitoring</a>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="../index.html">← Back to public site</a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="admin-mobile-toggle" aria-label="Toggle sidebar">☰</button>
          <h1>Account administration</h1>
        </div>
        <button class="btn btn-primary btn-sm" id="add-user-btn">Add user</button>
      </header>

      <div class="admin-content">
        <div id="alert-container"></div>

        <div class="stat-grid" style="margin-bottom: 1.5rem;">
          <div class="stat-card">
            <div class="stat-label">Total users</div>
            <div class="stat-value" id="stat-total-users">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Active</div>
            <div class="stat-value" id="stat-active-users" style="color: var(--status-available);">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Suspended</div>
            <div class="stat-value" id="stat-suspended-users" style="color: var(--status-none);">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Administrators</div>
            <div class="stat-value" id="stat-admin-users">0</div>
          </div>
        </div>

        <div class="filter-bar">
          <select id="filter-role" class="form-control">
            <option value="">All roles</option>
            <option value="resident">Residents</option>
            <option value="admin">Administrators</option>
          </select>
          <select id="filter-status" class="form-control">
            <option value="">All statuses</option>
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
          </select>
          <input type="search" id="filter-search" class="form-control" placeholder="Search by name or email…">
        </div>

        <div class="card">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Neighbourhood</th>
                  <th>Status</th>
                  <th>Joined</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="users-table"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="user-modal">
    <div class="modal" role="dialog" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title">Add user</h3>
        <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="user-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="user-name">Full name</label>
            <input type="text" id="user-name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="user-email">Email</label>
            <input type="email" id="user-email" class="form-control" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="user-role">Role</label>
              <select id="user-role" class="form-control">
                <option value="resident">Resident</option>
                <option value="admin">Administrator</option>
              </select>
            </div>
            <div class="form-group">
              <label for="user-neighborhood">Neighbourhood</label>
              <select id="user-neighborhood" class="form-control">
                <option value="">None (admin)</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save user</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/mock-data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Admin.initUsersPage();
    });
  </script>
</body>
</html>
